
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Virtual Piano</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #101010;
    color: #ddd;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px 0;
  }
  header { text-align: center; padding: 0 16px; }
  h1 {
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 3px;
    margin: 0 0 8px;
  }
  header p { font-size: 12px; color: #888; margin: 0; }
  .piano-shell {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 7px 0 12px;
    scrollbar-color: #555 #171717;
  }
  .piano {
    position: relative;
    display: flex;
    width: max-content;
    height: 300px;
    margin: 0 auto;
    padding: 0 13px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .white {
    position: relative;
    flex: 0 0 42px;
    height: 300px;
    background: linear-gradient(90deg,#d0d0d0 0%,#fff 25%,#f6f6f6 78%,#c9c9c9 100%);
    border: 1px solid #aaa;
    border-top: 0;
    border-radius: 0 0 6px 6px;
    box-shadow: inset 0 -2px 2px #aaa;
    cursor: pointer;
    color: #888;
    transition: background .06s;
  }
  .white .label {
    position: absolute;
    bottom: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 14px;
  }
  .black {
    position: absolute;
    z-index: 2;
    top: 0;
    width: 29px;
    height: 180px;
    margin-left: -14px;
    border: 1px solid #080808;
    border-radius: 0 0 10px 10px;
    background: linear-gradient(90deg,#080808,#303030 45%,#181818 80%,#050505);
    box-shadow: 0 7px 12px #0008, inset 0 -7px 5px #000;
    cursor: pointer;
    color: #72baff;
    transition: background .06s, height .06s;
  }
  .black .label {
    position: absolute;
    bottom: 17px;
    width: 100%;
    text-align: center;
    font-size: 12px;
  }
  .white.active {
    background: #b9dcff;
    box-shadow: inset 0 -4px 5px #80a9d3;
  }
  .black.active {
    height: 184px;
    background: linear-gradient(90deg,#17334a,#426d90,#152a3b);
  }
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 0 12px;
  }
  button {
    background: #222;
    border: 1px solid #454545;
    border-radius: 6px;
    padding: 10px 15px;
    color: #eee;
    cursor: pointer;
  }
  button:hover { background: #333; }
  button:focus-visible { outline: 2px solid #72baff; }
  .volume {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #aaa;
    font-size: 12px;
  }
  input[type=range] { width: 100px; accent-color: #72baff; }
  footer { color: #666; font-size: 11px; text-align: center; padding: 0 14px; }
  @media(max-height: 500px) {
    body { justify-content: flex-start; gap: 10px; }
    .piano, .white { height: 240px; }
    .black { height: 145px; }
  }
</style>
</head>
<body>
<header>
  <h1>VIRTUAL PIANO</h1>
  <p>Play with your keyboard or tap the keys</p>
</header>

<div class="piano-shell" id="pianoShell">
  <div class="piano" id="piano" aria-label="Virtual piano keyboard"></div>
</div>

<div class="controls">
  <button id="octaveDown" type="button">− Octave</button>
  <button id="octaveUp" type="button">+ Octave</button>
  <button id="sustain" type="button" aria-pressed="false">Sustain: Off</button>
  <label class="volume">
    Volume
    <input id="volume" type="range" min="0" max="100" value="35">
  </label>
</div>
<footer>Use the letter and number labels to play · Works on desktop and mobile</footer>

<script>
(() => {
  const whiteLabels = [
    '1','2','3','4','5','6','7','8','9','0',
    'q','w','e','r','t','y','u','i','o','p',
    'a','s','d','f','g','h','j','k','l',
    'z','x','c','v','b','n','m'
  ];

  // Each black key sits between the corresponding white keys.
  const blackLabels = [
    '!', '@', '$', '%', '^', '*', '(',
    'Q', 'W', 'E', 'T', 'Y',
    'I', 'O', 'P', 'S', 'D',
    'G', 'H', 'J', 'L', 'Z',
    'C', 'V', 'B'
  ];
  const blackAfter = [
    0,1,3,4,5,7,8,10,11,12,14,15,
    17,18,19,21,22,24,25,26,28,29,31,32
  ];

  const piano = document.getElementById('piano');
  const shell = document.getElementById('pianoShell');
  const whiteNotes = [];
  const keyMap = new Map();
  const active = new Map();

  // Generate white keys using the standard C-major note pattern.
  const semitones = [0,2,4,5,7,9,11];
  let octave = 3;
  let whiteIndex = 0;

  whiteLabels.forEach((label, i) => {
    const key = document.createElement('div');
    key.className = 'white';
    key.dataset.label = label;
    key.setAttribute('role', 'button');
    key.setAttribute('aria-label', 'White piano key ' + label);

    const caption = document.createElement('span');
    caption.className = 'label';
    caption.textContent = label;
    key.appendChild(caption);
    piano.appendChild(key);

    const degree = i % 7;
    const midi = 12 * (octave + Math.floor(i / 7)) + semitones[degree];
    whiteNotes.push({ label, midi, el: key, index: i });
    keyMap.set(label.toLowerCase(), { midi, el: key });
    whiteIndex++;
  });

  blackLabels.forEach((label, i) => {
    const after = blackAfter[i];
    const key = document.createElement('div');
    key.className = 'black';
    key.dataset.label = label;
    key.setAttribute('role', 'button');
    key.setAttribute('aria-label', 'Black piano key ' + label);

    const caption = document.createElement('span');
    caption.className = 'label';
    caption.textContent = label;
    key.appendChild(caption);
    piano.appendChild(key);

    const previous = whiteNotes[after];
    const midi = previous.midi + 1;
    keyMap.set(label.toLowerCase(), { midi, el: key });
  });

  // Web Audio synth: no audio files or external libraries needed.
  let audioContext;
  let master;
  let volume = 0.35;
  let sustain = false;
  let octaveShift = 0;
  const heldKeys = new Set();

  function initAudio() {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      master = audioContext.createGain();
      master.gain.value = volume;
      master.connect(audioContext.destination);
    }
    if (audioContext.state === 'suspended') audioContext.resume();
  }

  function frequency(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function play(id, entry) {
    if (active.has(id)) return;
    initAudio();

    const now = audioContext.currentTime;
    const pitch = entry.midi + octaveShift * 12;
    const gain = audioContext.createGain();
    const fundamental = audioContext.createOscillator();
    const harmonic = audioContext.createOscillator();
    const harmonicGain = audioContext.createGain();

    fundamental.type = 'triangle';
    fundamental.frequency.value = frequency(pitch);
    harmonic.type = 'sine';
    harmonic.frequency.value = frequency(pitch) * 2;
    harmonicGain.gain.value = 0.16;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.65, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.22, now + 0.25);

    fundamental.connect(gain);
    harmonic.connect(harmonicGain);
    harmonicGain.connect(gain);
    gain.connect(master);
    fundamental.start();
    harmonic.start();

    active.set(id, { gain, fundamental, harmonic, harmonicGain, el: entry.el });
    entry.el.classList.add('active');
  }

  function stop(id) {
    const voice = active.get(id);
    if (!voice || !audioContext) return;
    if (sustain && heldKeys.has(id)) return;

    const now = audioContext.currentTime;
    voice.gain.gain.cancelScheduledValues(now);
    voice.gain.gain.setTargetAtTime(0.0001, now, 0.12);
    voice.fundamental.stop(now + 0.5);
    voice.harmonic.stop(now + 0.5);
    voice.el.classList.remove('active');
    active.delete(id);
  }

  function press(id, entry) {
    if (heldKeys.has(id)) return;
    heldKeys.add(id);
    play(id, entry);
  }

  function release(id) {
    heldKeys.delete(id);
    if (!sustain) stop(id);
  }

  // Computer keyboard controls.
  window.addEventListener('keydown', event => {
    if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
    const label = event.key;
    const entry = keyMap.get(label.toLowerCase());
    if (!entry) return;
    event.preventDefault();
    press(label.toLowerCase(), entry);
  });

  window.addEventListener('keyup', event => {
    release(event.key.toLowerCase());
  });

  window.addEventListener('blur', () => {
    for (const id of [...heldKeys]) release(id);
  });

  // Pointer controls work for mouse, touch and stylus.
  piano.querySelectorAll('.white, .black').forEach(el => {
    const label = el.dataset.label.toLowerCase();
    const entry = keyMap.get(label);

    el.addEventListener('pointerdown', event => {
      event.preventDefault();
      el.setPointerCapture?.(event.pointerId);
      press(label, entry);
    });
    const end = () => release(label);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('lostpointercapture', end);
  });

  document.getElementById('volume').addEventListener('input', event => {
    volume = Number(event.target.value) / 100;
    if (master) master.gain.setTargetAtTime(volume, audioContext.currentTime, 0.02);
  });

  document.getElementById('sustain').addEventListener('click', event => {
    sustain = !sustain;
    event.currentTarget.textContent = 'Sustain: ' + (sustain ? 'On' : 'Off');
    event.currentTarget.setAttribute('aria-pressed', String(sustain));
    if (!sustain) {
      for (const id of [...active.keys()]) {
        if (!heldKeys.has(id)) stop(id);
      }
    }
  });

  function shiftOctave(amount) {
    octaveShift = Math.max(-2, Math.min(2, octaveShift + amount));
    // Keep the controls simple; new notes use the selected octave.
  }
  document.getElementById('octaveDown').addEventListener('click', () => shiftOctave(-1));
  document.getElementById('octaveUp').addEventListener('click', () => shiftOctave(1));

  // Make the first key visible when the page opens.
  shell.scrollLeft = 0;
})();
</script>
</body>
</html>
